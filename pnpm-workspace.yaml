packages:
  - "packages/*"
  - "packages/adapters/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
# Force patched floors for memo Criticals (pnpm 11: overrides live here, not package.json).
# Capped at the current major: an override replaces the manifest range, so an
# open floor let `pnpm update` carry vitest from 3 to 5.
overrides:
  vitest: ">=3.2.7 <4"
  happy-dom: ">=20.8.9 <21"
