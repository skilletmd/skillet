# Paths GitHub secret scanning should not open alerts for.
#
# The harm scanner's job is detecting credentials inside published skills, so
# its corpora and tests hold secret-SHAPED strings on purpose — they are the
# fixtures its own detectors are asserted against, never real credentials. The
# same paths are allowlisted for gitleaks in .gitleaks.toml.
#
# This suppresses ALERTS only. Push protection still evaluates these paths, so
# fixtures use documented placeholder values (e.g. AWS's AKIAIOSFODNN7EXAMPLE)
# rather than relying on this file alone.
paths-ignore:
  - 'packages/registry/src/scanner/**'
  - 'packages/registry/tests/scan-redos.test.ts'
  - 'packages/web/tests/publish-scan-dialog.test.tsx'
