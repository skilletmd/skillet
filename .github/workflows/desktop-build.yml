name: Desktop build (Tauri)

permissions:
  contents: read

# Builds the Skillet desktop app for macOS, Windows, and Linux. Tauri can't
# cross-compile (each OS needs its own native webview + linker), so this fans out
# to one runner per platform. Produces installers as artifacts.
# Manual only, on purpose. This matrix builds on macOS, Windows and Linux, and
# macOS runners bill at 10x minutes, so it does not fire on every push while the
# repo is private. Run it from the Actions tab when you want installers.
#
# When the repo goes public, standard runners are free — restore the push
# trigger then by uncommenting the block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "packages/desktop/**"
  #     - "packages/cli/**"
  #     - "packages/core/**"
  #     - "packages/protocol/**"
  #     - ".github/workflows/desktop-build.yml"

jobs:
  build:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Linux webview + tray deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 10 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "packages/desktop/src-tauri -> target" }

      # Install only the desktop package's JS deps. (The rest of the monorepo —
      # including the unrelated mcp build — is not needed to build this app.)
      - run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@735343e4c3bd1c3800b96cfe6df97445ddb5406 # v2

      # tauri build bundles a standalone skillet sidecar (see prepare-skillet-sidecar.mjs)
      # then produces the platform installer.
      - run: pnpm --filter @skillet/desktop run tauri build

      - name: Upload unsigned macOS app (notarize input)
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillet-desktop-macos-unsigned
          path: packages/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillet-desktop-${{ matrix.name }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  # Signing material is optional. Forks never receive secrets, a fresh clone has
  # none configured, and no contributor should need an Apple Developer ID for CI
  # to pass — so presence is probed here and the notarize job skips when it is
  # absent. It has to be a job output because `secrets` is not available in a
  # job-level `if`.
  signing-available:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No macOS signing secrets configured - skipping notarization." >> "$GITHUB_STEP_SUMMARY"
          fi

  notarize-macos:
    name: macOS sign + notarize
    needs: [build, signing-available]
    if: github.ref == 'refs/heads/main' && needs.signing-available.outputs.ready == 'true'
    uses: ./.github/workflows/macos-notarize.yml
    with:
      app-artifact: skillet-desktop-macos-unsigned
      bundle-id: sh.skillet.desktop
      dmg-name: Skillet.dmg
    secrets:
      DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
      NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
