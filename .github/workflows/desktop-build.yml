name: Desktop build (Tauri)

permissions:
  contents: read

# Builds the Skillet desktop app for macOS and Windows. Tauri can't
# cross-compile (each OS needs its own native webview + linker), so this fans out
# to one runner per platform. Produces installers as artifacts.
#
# macOS and Windows only, matching release.yml — the signed release path ships
# those two, and Linux auto-update is deferred. We built a Linux installer here
# for a while and never shipped or tested it; an untested app is worse than no
# app. Add ubuntu back here and to release.yml together, or not at all.
#
# Manual only, on purpose: macOS runners bill at 10x minutes, so this does not
# fire on every push while the repo is private. Run it from the Actions tab when
# you want installers.
#
# When the repo goes public, standard runners are free — restore the push
# trigger then by uncommenting the block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "packages/desktop/**"
  #     - "packages/cli/**"
  #     - "packages/core/**"
  #     - "packages/protocol/**"
  #     - ".github/workflows/desktop-build.yml"

jobs:
  build:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "packages/desktop/src-tauri -> target" }

      # Install only the desktop package's JS deps. (The rest of the monorepo —
      # including the unrelated mcp build — is not needed to build this app.)
      - run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # tauri build bundles a standalone skillet sidecar (see prepare-skillet-sidecar.mjs)
      # then produces the platform installer.
      # createUpdaterArtifacts is on in tauri.conf.json and a pubkey is set, so
      # `tauri build` demands TAURI_SIGNING_PRIVATE_KEY to sign the update
      # payload — which contradicts this workflow's whole premise that signing
      # material is optional and a fork with no secrets still builds. These are
      # test artifacts, not a release: no one auto-updates from them, so turn
      # updater artifacts off here. release.yml keeps them and supplies the key.
      # Passed as a FILE, not inline JSON: single quotes do not quote on Windows,
      # so an inline --config '{"bundle":...}' reaches tauri with its double
      # quotes stripped and fails to parse. A path is shell-agnostic.
      - run: >-
          pnpm --filter @skillet/desktop exec tauri build
          --config src-tauri/tauri.ci-unsigned.conf.json

      - name: Upload unsigned macOS app (notarize input)
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillet-desktop-macos-unsigned
          path: packages/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillet-desktop-${{ matrix.name }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  # Signing material is optional. Forks never receive secrets, a fresh clone has
  # none configured, and no contributor should need an Apple Developer ID for CI
  # to pass — so presence is probed here and the notarize job skips when it is
  # absent. It has to be a job output because `secrets` is not available in a
  # job-level `if`.
  signing-available:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$NOTARY_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No macOS signing secrets configured - skipping notarization." >> "$GITHUB_STEP_SUMMARY"
          fi

  notarize-macos:
    name: macOS sign + notarize
    needs: [build, signing-available]
    if: github.ref == 'refs/heads/main' && needs.signing-available.outputs.ready == 'true'
    uses: ./.github/workflows/macos-notarize.yml
    with:
      app-artifact: skillet-desktop-macos-unsigned
      bundle-id: sh.skillet.desktop
      dmg-name: Skillet.dmg
    secrets:
      DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
      DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
      NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
