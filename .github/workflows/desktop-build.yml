name: Desktop build (Tauri)

permissions:
  contents: read

# Builds the Skillet desktop app for macOS and Windows. Tauri can't
# cross-compile (each OS needs its own native webview + linker), so this fans out
# to one runner per platform. Produces installers as artifacts.
#
# macOS and Windows only, matching release.yml — the signed release path ships
# those two, and Linux auto-update is deferred. We built a Linux installer here
# for a while and never shipped or tested it; an untested app is worse than no
# app. Add ubuntu back here and to release.yml together, or not at all.
#
# Manual only, on purpose: macOS runners bill at 10x minutes, so this does not
# fire on every push while the repo is private. Run it from the Actions tab when
# you want installers.
#
# When the repo goes public, standard runners are free — restore the push
# trigger then by uncommenting the block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "packages/desktop/**"
  #     - "packages/cli/**"
  #     - "packages/core/**"
  #     - "packages/protocol/**"
  #     - ".github/workflows/desktop-build.yml"

jobs:
  build:
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "packages/desktop/src-tauri -> target" }

      # Install only the desktop package's JS deps. (The rest of the monorepo —
      # including the unrelated mcp build — is not needed to build this app.)
      - run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Windows OS code-signing happens INSIDE tauri build, via the signCommand
      # in tauri.windows-signing.conf.json, so the signer has to be on PATH
      # first. Azure Trusted Signing needs no cert file: trusted-signing-cli
      # reads the AZURE_* credentials from the environment.
      - name: Install Azure signer
        if: matrix.name == 'windows' && env.AZURE_TENANT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: cargo install trusted-signing-cli --version 0.11.0 --locked

      # tauri build bundles a standalone skillet sidecar (see prepare-skillet-sidecar.mjs)
      # then produces the platform installer.
      # createUpdaterArtifacts is on in tauri.conf.json and a pubkey is set, so
      # `tauri build` demands TAURI_SIGNING_PRIVATE_KEY to sign the update
      # payload. This workflow produces test artifacts, not a release, and no one
      # auto-updates from them — so updater artifacts are off here and the key
      # never has to reach CI. release.yml is the signed release path.
      # Passed as a FILE, not inline JSON: single quotes do not quote on Windows,
      # so an inline --config '{"bundle":...}' reaches tauri with its double
      # quotes stripped and fails to parse. A path is shell-agnostic.
      #
      # Windows additionally merges the Azure signing overlay, which signs the
      # installer as it is bundled. Config files merge in order, so the unsigned
      # updater setting stays and the signCommand is layered on top.
      - env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >-
          pnpm --filter @skillet/desktop exec tauri build
          --config src-tauri/tauri.ci-unsigned.conf.json
          ${{ matrix.name == 'windows' && '--config src-tauri/tauri.windows-signing.conf.json' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skillet-desktop-${{ matrix.name }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14

