name: Guards

# Cheap, always-on checks (~20s). Deliberately NOT in ci.yml: ci.yml skips
# docs-only pushes to avoid a 9-minute build for a Markdown change, but these
# three must run on every change, docs included. A secret can be pasted into a
# doc, a tracker ID can land in a comment, and docs/registry-api.md is itself a
# generated doc.
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Scans the checked-out tree for committed secrets. Pinned, redacted, and
      # config-driven so example-file placeholders don't false-positive.
      # NOTE: this scans the working tree only. The full git-history scan is a
      # manual pre-publish gate — see CONTRIBUTING.md before flipping public.
      - name: gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: >-
            detect
            --source=/github/workspace
            --config=/github/workspace/.gitleaks.toml
            --no-git
            --redact
            --no-banner
            --verbose

      # Fast, dependency-free guard: fail if any internal tracker ID or the
      # trademark TODO is committed. Exemptions are documented in the script
      # (docs/plans/**, pnpm-lock.yaml, the script).
      - name: No internal tracker IDs
        run: node scripts/check-no-tracker-ids.mjs

      # The registry HTTP API doc is generated from source — fail if it drifted.
      - name: Registry API doc is current
        run: node scripts/gen-registry-api.mjs --check

  # Split out because it is the one guard that needs node_modules, and putting
  # it in secret-scan broke that whole job the day it landed: ecosystem.config
  # resolves tsx's real path via require.resolve, which throws MODULE_NOT_FOUND
  # without an install, so the step exited 1 on every push and took gitleaks'
  # green with it. The guard meant to catch a silently dead cron job was itself
  # silently dead for its entire life. Everything in secret-scan above uses
  # node: builtins only and stays install-free.
  pm2-entrypoints:
    name: PM2 entrypoints match their interpreter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A PM2 app whose `script` its declared interpreter cannot parse dies in
      # milliseconds and still reports `online`. mirror-nightly did exactly that
      # at 06:00 every day for over a month before anyone noticed.
      - name: PM2 entrypoints match their interpreter
        run: node scripts/check-pm2-entrypoints.mjs
