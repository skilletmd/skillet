name: CI

# Docs-only changes skip this workflow: it is a ~9-minute build (Linux install +
# build + lint + test, plus a Windows Rust compile), and a Markdown edit cannot
# break any of it. The cheap always-on checks — gitleaks, tracker IDs, generated
# registry-api drift — live in guards.yml precisely so they still run here.
# `paths-ignore` skips only when EVERY changed file matches, so a commit that
# touches code and a doc together still runs in full. Note `*.md` is root-level
# only: a Markdown file inside packages/ can be a test fixture, so those still
# trigger a run — with an exception for packages/**/README.md, which is package
# documentation (packages/cli/README.md is the npm landing page) and cannot
# affect a build.
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "packages/**/README.md"
      - ".github/assets/**"
      - LICENSE
  pull_request:
    branches: [main]
    # Repeated verbatim, not aliased: GitHub Actions does not support YAML
    # anchors, and it fails the workflow rather than ignoring them.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "packages/**/README.md"
      - ".github/assets/**"
      - LICENSE

jobs:
  ci:
    name: Install → Build → Lint → Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Lint CSS (radius scale)
        run: pnpm --filter @skillet/web lint:css

  # Windows is a first-class desktop target, and the bugs it surfaces do not
  # reproduce on Linux: POSIX-only PATH splitting, missing `.exe` suffixes, bare
  # `.cmd` spawns, symlink and path-separator assumptions. Those compile clean
  # and fail at runtime, so only running the suites here catches them.
  #
  # This job deliberately does NOT run the whole `pnpm test`. Two Windows
  # blockers are environmental and would land it permanently red, which is worse
  # than not having it:
  #   1. Concurrent `prisma generate` races on query_engine-windows.dll.node
  #      (EPERM). Needs `-r --workspace-concurrency=1` to serialise.
  #   2. adapters/codex: on Windows `tmpdir()` lives inside the home dir, so
  #      findProjectRoot walks up out of its fixture into the real ~/.codex.
  # Until those are fixed, this runs the suites verified green on Windows plus
  # the whole cross-platform toolchain. Widen it as the blockers are cleared.
  ci-windows:
    name: Windows (build, typecheck, desktop + CLI suites)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Catches the POSIX-ism class in build scripts: `set -a && . ./.env`,
      # bare `pnpm` spawns, and anything else cmd.exe cannot run.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Desktop tests
        run: pnpm --filter @skillet/desktop test

      - name: CLI tests
        run: pnpm --filter skilletmd test

      # The Rust side: PATH resolution, `.exe` suffixes and the no-console-window
      # spawn flags are all cfg'd per platform, so they are only really exercised
      # on a Windows runner.
      # tauri's build script refuses to compile unless every declared externalBin
      # resource exists on disk, and the real sidecar is a Bun-compiled binary
      # produced by prepare-skillet-sidecar.mjs during a full app build. These
      # are 15 pure-logic unit tests that never spawn it, so an empty placeholder
      # satisfies the build script without pretending the sidecar was tested.
      # Building the real one here would add Bun plus a full CLI bundle to every
      # CI run for tests that do not use it.
      - name: Stage a placeholder sidecar
        shell: bash
        run: |
          mkdir -p packages/desktop/src-tauri/binaries
          : > packages/desktop/src-tauri/binaries/skillet-x86_64-pc-windows-msvc.exe

      - name: Desktop Rust tests
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml --no-default-features
