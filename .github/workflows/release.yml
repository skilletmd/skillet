name: Desktop release (signed + auto-update)

# Tag-driven release: build the Skillet desktop app for macOS + Windows, sign +
# notarize (macOS) / Azure-Trusted-Sign (Windows), minisign the update artifacts,
# and publish the installers + latest.json to this repo's GitHub Releases. The
# in-app updater reads https://skillet.md/desktop/latest.json, which redirects to
# the newest release's latest.json (so a repo/org rename never breaks installed apps).
#
# Cut a release: bump packages/desktop/src-tauri/tauri.conf.json `version`, then
#   git tag desktop-vX.Y.Z && git push origin desktop-vX.Y.Z
# The tag version MUST match the tauri.conf.json version (guarded below).
#
# Tags are component-prefixed because this repo publishes several artifacts from
# one history: `desktop-v*` here, `cli-v*` in cli-publish.yml. A bare `vX.Y.Z`
# names no particular component and, as a trigger, greedily matches any future
# tag starting with `v`. desktop-v0.1.0 and the bare v0.1.1 predate this and are
# left alone — a GitHub Release is bound to its tag, so renaming one would break
# that version's download URL for nothing.
#
# Prerequisites — provide these as repository/organization secrets:
#   Apple (macOS):   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#                    APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   Azure (Windows): AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
#                    (Azure Trusted Signing account + certificate profile)
#   Updater (both):  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Windows/Linux note: Linux auto-update is deferred (macOS + Windows at launch).

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  guard-version:
    runs-on: ubuntu-latest
    outputs:
      # The bare semver, prefix stripped. The release job uses it for the
      # human-facing release name so the display title does not carry the
      # component prefix the tag needs.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Release must be triggered from a version tag
        run: |
          # workflow_dispatch from a branch would otherwise release under the
          # branch name; require a tag ref for both dispatch and push.
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Run this workflow from a desktop-vX.Y.Z tag, not ${GITHUB_REF_NAME} (a ${GITHUB_REF_TYPE})."
            exit 1
          fi
      - name: Tag must match tauri.conf.json version
        id: version
        run: |
          # Strip the component prefix first, then a bare leading v, so the
          # guard still reads a version from a legacy vX.Y.Z tag if one is ever
          # replayed via workflow_dispatch.
          tag="${GITHUB_REF_NAME#desktop-}"
          tag="${tag#v}"
          conf=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          echo "tag=$tag conf=$conf"
          if [ "$tag" != "$conf" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version $tag) does not match tauri.conf.json version $conf"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Signing placeholders must be replaced
        run: |
          # The dev updater pubkey and the Windows cert-profile placeholder are
          # committed on purpose (so the app builds); this gate stops a real
          # release from shipping them — a placeholder pubkey either bricks
          # auto-update or, worse, verifies a forged update.
          if grep -q "dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDY5NDgzQUM5QUI2QTlBODc" packages/desktop/src-tauri/tauri.conf.json; then
            echo "::error::tauri.conf.json still has the PLACEHOLDER updater pubkey — replace it with the production key before releasing."
            exit 1
          fi
          if grep -q "REPLACE_WITH_CERT_PROFILE_NAME" packages/desktop/src-tauri/tauri.windows-signing.conf.json; then
            echo "::error::Windows signing overlay still has REPLACE_WITH_CERT_PROFILE_NAME — set the Azure certificate profile name before releasing."
            exit 1
          fi

  release:
    needs: guard-version
    # Gated on the `release` environment, which requires a human approval before
    # the job starts. This job holds every signing secret — Apple, Azure, and the
    # updater key that signs an update every installed Skillet will execute — so
    # a stolen token or a pushed tag alone must not be enough to produce a signed
    # release. Approve it in the run's UI.
    environment: release
    permissions:
      contents: write # create the GitHub Release + upload assets
    strategy:
      fail-fast: false
      # Serialize the platforms: both legs upload to the SAME draft release, and
      # tauri-action's latest.json handling is a read-merge-write. Running them
      # concurrently can race — the second read misses the first's write and one
      # platform is dropped from latest.json. One-at-a-time removes the race;
      # releases are rare, so the extra wall-clock is worth the correctness.
      max-parallel: 1
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: pnpm }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with: { workspaces: "packages/desktop/src-tauri -> target" }

      - run: pnpm install --frozen-lockfile

      # Windows OS code-signing runs INSIDE the tauri build via a signCommand
      # overlay (tauri.windows-signing.conf.json), so Azure Trusted Signing signs
      # the installer BEFORE the updater minisig is computed over it. Install the
      # signer CLI; it reads the AZURE_* creds from the environment.
      # The desktop app bundles a Bun-compiled sidecar (build-native.mjs), so
      # tauri's beforeBuildCommand fails without Bun on PATH. desktop-build.yml
      # has had this since it was written; the release path never did, because
      # it had never run.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Trusted Signing CLI (Windows)
        if: matrix.name == 'windows'
        # Pinned + --locked: this runs in the secrets-bearing job, so don't pull
        # an unversioned crate fresh from crates.io each release.
        run: cargo install trusted-signing-cli --version 0.11.0 --locked

      # tauri-action builds, signs (Apple env on macOS; the Windows overlay's
      # signCommand on Windows), minisigns the update artifacts, generates
      # latest.json, and creates/updates the GitHub Release for this tag.
      # tauri notarizes with an App Store Connect API key, and wants a PATH to
      # the .p8 rather than its contents — so the secret holds base64 and this
      # materializes it into the runner's temp dir. Same credential the local
      # build uses, so there is one Apple credential set rather than two.
      - name: Stage the App Store Connect key (macOS)
        if: matrix.name == 'macos' && env.KEY_B64 != ''
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, and publish
        # SHA-pinned (like every other action here): this step sees ALL signing
        # secrets, so a moved @v0 tag could exfiltrate them + publish a malicious
        # signed release.
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Apple code-signing + notarization (macOS) ---
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Notarization via App Store Connect API key (not an Apple ID +
          # app-specific password): fewer credentials, and the same ones the
          # local build already uses. APPLE_API_KEY is the 10-char Key ID and
          # APPLE_API_ISSUER the issuer UUID — both identifiers, useless without
          # the .p8 staged above.
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # --- Azure Trusted Signing (Windows) — read by trusted-signing-cli ---
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          # --- Updater artifact signing (minisign; both platforms) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_name }}
          # Display name drops the component prefix: the release page already
          # sits under this repo, so "Skillet v0.1.2" reads better than
          # "Skillet desktop-v0.1.2". The tag itself keeps the prefix.
          releaseName: "Skillet v${{ needs.guard-version.outputs.version }}"
          # Draft, NOT published: both platform legs upload their installers +
          # merge latest.json into this draft. The separate `publish` job flips
          # it public only after EVERY leg succeeds, so the live updater endpoint
          # (releases/latest/download/latest.json) never sees a half-built
          # release. A failed leg leaves the draft unpublished for inspection.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # On Windows, merge the Azure Trusted Signing signCommand overlay.
          args: ${{ matrix.name == 'windows' && '--config src-tauri/tauri.windows-signing.conf.json' || '' }}

      # tauri notarizes and staples the .app, then wraps an UNNOTARIZED .dmg
      # around it: the dmg carries a Developer ID signature but no ticket of its
      # own, and `spctl --assess --type open` (what Finder runs when you
      # double-click a disk image) rejects it. v0.1.1 shipped that way and had to
      # be stapled by hand after the fact. The local build never hit this because
      # it ran `pnpm notarize:macos` as a second step; the CI path had no
      # equivalent. Staple the dmg here, then replace the copy tauri-action
      # already uploaded to the draft.
      - name: Notarize and staple the dmg (macOS)
        if: matrix.name == 'macos'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          dmg=$(ls packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          # The real gate. `notarytool submit` can exit 0 on a rejected
          # submission, and stapling a ticketless dmg is the failure we are
          # guarding against, so assert Gatekeeper's own verdict before upload.
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          gh release upload "${GITHUB_REF_NAME}" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # Only reached when the release job succeeded for ALL platforms (a matrix job
    # succeeds only if every leg does). Flipping the draft public here is the
    # atomic barrier: partial or failed builds never become the "latest" release.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the draft + mark it latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
