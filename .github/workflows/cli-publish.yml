name: CLI publish (npm provenance)

# Tag-driven publish for skilletmd and per-platform optionalDependency packages.
# Cut a release: bump packages/cli/package.json version (and platform packages), then:
#   git tag cli-vX.Y.Z && git push origin cli-vX.Y.Z
#
# Prerequisites: npm trusted publisher OIDC for this repo (npmjs.com package settings).

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
  push:
    tags:
      - "cli-v*"

jobs:
  publish-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native binary
        run: pnpm --filter skilletmd run build-native -- --target ${{ matrix.target }}

      - name: Stage platform package
        shell: bash
        env:
          CLI_PUBLISH_VERSION: ${{ github.ref_name }}
        run: |
          export CLI_PUBLISH_VERSION="${CLI_PUBLISH_VERSION#cli-v}"
          node packages/cli/scripts/stage-platform-binaries.mjs --only ${{ matrix.target }}

      - name: Prepare npm OIDC publish
        run: node packages/cli/scripts/prepare-npm-oidc-publish.mjs

      - name: Publish platform package with provenance
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG="packages/cli-${{ matrix.target }}"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN
            node packages/cli/scripts/prepare-npm-oidc-publish.mjs
          fi
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('$PKG/package.json')); p.version='$VERSION'; fs.writeFileSync('$PKG/package.json', JSON.stringify(p,null,2)+'\n');"
          cd "$PKG" && npm publish --provenance --access restricted

  publish-main:
    needs: publish-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: node packages/cli/scripts/build-cli-deps.mjs

      - name: Bundle CLI for npm fallback
        run: pnpm --filter skilletmd bundle

      - name: Prepare publish manifest
        run: node packages/cli/scripts/publish-prep.mjs

      - name: Prepare npm OIDC publish
        run: node packages/cli/scripts/prepare-npm-oidc-publish.mjs

      - name: Publish skilletmd with provenance
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#cli-v}"
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN
            node packages/cli/scripts/prepare-npm-oidc-publish.mjs
          fi
          node -e "const fs=require('fs'); const p='packages/cli/package.json'; const j=JSON.parse(fs.readFileSync(p)); j.version='$VERSION'; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"
          cd packages/cli && npm publish --provenance --access public

      - name: Restore package.json
        if: always()
        run: node packages/cli/scripts/publish-restore.mjs
