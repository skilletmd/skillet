name: PR title (Conventional Commits)

# Squash-merge turns each PR into one commit whose subject is the PR TITLE, so
# the PR title is what lands on main and what release-please reads. This lints
# it — the enforcing gate for contributors, who won't have the local commit-msg
# hook. Types/scopes mirror commitlint.config.cjs.
#
# To make this blocking, add "PR title" as a required status check in the
# branch-protection rule for `main`. Without that it reports but never blocks.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
            polish
            refine
          scopes: |
            cli
            registry
            web
            core
            protocol
            desktop
            mcp
            adapters
            sync
            ci
            deps
            release
            docs
          requireScope: false
          # Subjects are free-form case; just don't allow a trailing period.
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" is invalid. It must not start with an
            uppercase letter and must not end with a period.
