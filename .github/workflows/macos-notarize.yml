name: macOS Sign + Notarize

# Reusable, app-stack-agnostic Developer ID signing + Apple notarization pipeline
# for the Skillet macOS app. The build step is the only stack-specific
# part (Swift / Tauri / Electron) and lives in the app repo's caller workflow;
# everything below — codesign with hardened runtime, notarytool submit, staple,
# and Gatekeeper verification ("no warnings" bar) — is identical regardless of
# how the .app is produced.
#
# Wire-up: a release workflow in this repo calls this reusable workflow with the
# rename-proof relative path `uses: ./.github/workflows/macos-notarize.yml` (see
# desktop-build.yml) and passes the built, unsigned .app path. Apple credentials
# are provisioned as org-level secrets and gated behind the protected `release`
# environment (see below).

on:
  workflow_call:
    inputs:
      app-path:
        description: "Path to the built, unsigned .app bundle (ignored when app-artifact is set)"
        required: false
        default: ""
        type: string
      app-artifact:
        description: "Optional workflow artifact name containing the unsigned .app"
        required: false
        default: ""
        type: string
      dmg-name:
        description: "Output DMG filename (e.g. Skillet.dmg)"
        required: false
        default: "Skillet.dmg"
        type: string
      bundle-id:
        description: "App bundle identifier (e.g. sh.skillet.app)"
        required: true
        type: string
    secrets:
      # Developer ID Application cert (base64 .p12) + its password.
      DEVELOPER_ID_CERT_P12_BASE64:
        required: true
      DEVELOPER_ID_CERT_PASSWORD:
        required: true
      # App Store Connect API key for notarytool (key id / issuer / .p8 base64).
      NOTARY_API_KEY_ID:
        required: true
      NOTARY_API_ISSUER_ID:
        required: true
      NOTARY_API_KEY_P8_BASE64:
        required: true
  # Manual smoke runs once an artifact exists. Never auto-runs on push, so this
  # scaffold can land before the app does without touching the green CI gate.
  workflow_dispatch:
    inputs:
      app-path:
        description: "Path to a pre-built .app for a manual notarize dry-run"
        required: true
        type: string
      dmg-name:
        required: false
        default: "Skillet.dmg"
        type: string
      bundle-id:
        required: true
        type: string

jobs:
  sign-notarize:
    name: Sign → Notarize → Staple → Verify
    runs-on: macos-14
    # Protected environment: stores the Apple credentials behind required-reviewer
    # approval + branch/tag restriction, so both workflow_dispatch (arbitrary
    # app-path) and release runs land behind a human gate before any secret is
    # exposed.
    environment: release
    steps:
      - name: Download unsigned app artifact
        if: inputs.app-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app-artifact }}
          path: unsigned-app

      - name: Resolve app bundle path
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.app-artifact }}" ]; then
            APP_PATH="$(find "$GITHUB_WORKSPACE/unsigned-app" -name '*.app' -maxdepth 4 | head -n1)"
            if [ -z "$APP_PATH" ]; then
              echo "::error::No .app bundle found in artifact ${{ inputs.app-artifact }}" >&2
              exit 1
            fi
          else
            APP_PATH="${{ inputs.app-path || github.event.inputs.app-path }}"
            if [ -z "$APP_PATH" ]; then
              echo "::error::app-path is required when app-artifact is not set" >&2
              exit 1
            fi
          fi
          echo "RESOLVED_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Using app bundle: $APP_PATH"

      - name: Import Developer ID signing certificate
        env:
          CERT_B64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/skillet-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Make this keychain searchable for codesign without dropping the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Resolve signing identity
        run: |
          set -euo pipefail
          IDENTITY="$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" \
            | grep -o '"Developer ID Application[^"]*"' | head -n1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain." >&2
            exit 1
          fi
          echo "Using identity: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Codesign with hardened runtime
        run: |
          set -euo pipefail
          # Deep sign nested binaries/frameworks first, then the bundle.
          # Hardened runtime (--options runtime) + secure timestamp are the two
          # things notarization rejects the build for if missing.
          codesign --force --deep --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" "$RESOLVED_APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$RESOLVED_APP_PATH"

      - name: Package DMG
        env:
          DMG_NAME: ${{ inputs.dmg-name || github.event.inputs.dmg-name }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE"
          cp -R "$RESOLVED_APP_PATH" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Skillet" -srcfolder "$STAGE" -ov \
            -format UDZO "$RUNNER_TEMP/$DMG_NAME"
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$RUNNER_TEMP/$DMG_NAME"
          echo "DMG_PATH=$RUNNER_TEMP/$DMG_NAME" >> "$GITHUB_ENV"

      - name: Notarize with notarytool
        env:
          KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Staple ticket
        run: |
          set -euo pipefail
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Verify Gatekeeper acceptance (no-warning bar)
        run: |
          set -euo pipefail
          # This is the non-dev install bar: a freshly downloaded build must pass
          # spctl assessment as "accepted" or first-launch shows the scary warning.
          spctl --assess --type execute --verbose=4 "$RESOLVED_APP_PATH"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$DMG_PATH" || true

      - name: Upload signed + notarized DMG
        uses: actions/upload-artifact@v4
        with:
          name: skillet-macos-dmg
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
