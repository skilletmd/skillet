services:
  registry-mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: skillet
      MYSQL_DATABASE: skillet_registry
      MYSQL_USER: skillet
      MYSQL_PASSWORD: skillet
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pskillet"]
      interval: 3s
      timeout: 3s
      retries: 40
